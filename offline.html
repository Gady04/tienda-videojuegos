<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión - GameStore</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #120924;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            color: #39ff14; /* Verde Neón Gamer */
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-bottom: 30px;
        }
        button {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 5px;
            border: none;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <h1>¡Estás fuera de juego (Offline)!</h1>
    <p>Revisa tu conexión a internet para seguir explorando la tienda.</p>
    <button onclick="window.location.reload()">Reintentar Conexión</button>
</body>
</html>
